# Albert Deep Dive — one-click deployment on Render.
#
# Render reads this file when you create a Blueprint from the repository and provisions
# everything below. The only value you are asked for is your OpenAI API key; the database, the
# secrets, the disk that holds photographs and exports, and the hourly automation are all set up
# here. Email is not configured in the environment at all: you connect a Gmail mailbox from
# Settings → Email once the site is up.
databases:
  - name: albertdeepdive-db
    databaseName: albertdeepdive
    user: albertdeepdive
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: albertdeepdive
    # Built from the Dockerfile, on Playwright's image: the print renderer drives a real Chromium,
    # and installing one on a generic Node image needs root for apt.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard # Chromium renders the PDF in this process and needs the memory.
    region: frankfurt
    branch: main
    # Migrations run on every deploy; the demo issue is loaded once, into an empty database only.
    preDeployCommand: pnpm db:migrate && pnpm db:seed:once
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      # The one thing you provide. Render asks for it when the blueprint is created.
      - key: OPENAI_API_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: albertdeepdive-db
          property: connectionString

      # Generated once by Render and never shown: signs sessions, contribution links, storage
      # URLs, and encrypts the Gmail app password.
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTOMATION_TICK_TOKEN
        generateValue: true
      # The first administrator. Change the password from Settings → Profile after signing in.
      - key: SEED_ADMIN_EMAIL
        value: admin@albertschool.com
      - key: SEED_ADMIN_PASSWORD
        generateValue: true

      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: albertdeepdive
          property: url
      - key: APP_NAME
        value: Albert Deep Dive
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PNPM_VERSION
        value: "10"

      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL_FAST
        value: gpt-4.1-mini
      - key: AI_MODEL_STRONG
        value: gpt-4.1

      # Email lives in the database, set up from Settings → Email. Until a mailbox is connected
      # messages are only recorded, so nothing is sent by accident on a fresh deployment.
      - key: EMAIL_PROVIDER
        value: log

      # Photographs, variants and exports go on the attached disk.
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/storage

      # Jobs run inside the web service; the cron below drives the monthly rhythm.
      - key: JOBS_RUNNER
        value: inprocess
      - key: LOG_LEVEL
        value: info

  # The monthly rhythm: opens the campaign, sends the reminders, closes it, runs the pipeline,
  # and reads the newsroom mailbox for replies.
  - type: cron
    name: albertdeepdive-tick
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: pnpm tick
    plan: starter
    region: frankfurt
    branch: main
    schedule: "5 * * * *"
    envVars:
      - key: APP_URL
        fromService:
          type: web
          name: albertdeepdive
          property: url
      - key: AUTOMATION_TICK_TOKEN
        fromService:
          type: web
          name: albertdeepdive
          envVarKey: AUTOMATION_TICK_TOKEN
