<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Briefly</title>
  <defs>
    <linearGradient id="b-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.28" stop-color="#4285F4"/>
      <stop offset="0.72" stop-color="#EA4335"/>
    </linearGradient>
    <linearGradient id="b-bottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.28" stop-color="#34A853"/>
      <stop offset="0.72" stop-color="#FBBC04"/>
    </linearGradient>
    <linearGradient id="b-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#000000"/>
    </linearGradient>
    <mask id="b-upper" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="url(#b-fade)"/>
    </mask>
    <linearGradient id="b-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F4F8"/>
    </linearGradient>
    <filter id="b-lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14" result="blur"/>
      <feFlood flood-color="#0B1530" flood-opacity="0.24"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#b-bottom)"/>
  <rect width="512" height="512" rx="118" fill="url(#b-top)" mask="url(#b-upper)"/>
  <rect width="512" height="512" rx="118" fill="url(#b-sheen)"/>
  <rect x="142" y="142" width="228" height="228" rx="62" fill="url(#b-page)" filter="url(#b-lift)"/>
</svg>
